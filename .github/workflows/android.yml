name: Compilar APK de Android

# Se ejecuta a mano (pestaña Actions > "Compilar APK de Android" > Run workflow)
# y también cada vez que subes cambios a la rama principal.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pruebas del cálculo (área y zonas de vida)
        run: npm test

      # npm ci instala exactamente las versiones de package-lock.json (y falla si no coinciden con package.json):
      # cada compilación usa las mismas librerías que se probaron.
      - name: Instalar dependencias
        run: npm ci

      - name: Crear el proyecto Android
        run: npx cap add android

      # Permisos de GPS, ícono, versión (versionCode y versionName salen de package.json) y firma de publicación.
      - name: Permisos, versión, firma e ícono
        run: node scripts/patch-android.js

      - name: Comprobar que el manifiesto pide el GPS
        run: grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Mostrar versión y niveles de Android
        run: |
          grep -nE "versionCode|versionName" android/app/build.gradle
          grep -nE "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          if grep -qE "versionCode 1$" android/app/build.gradle; then echo "::error::versionCode quedó en 1: no se aplicó la versión de package.json"; exit 1; fi

      - name: Copiar la web a Android
        run: npx cap sync android

      # 2.34.4: bajo el ícono va el nombre corto (el completo se cortaba con «…»); en Ajustes y en los permisos sigue el completo
      - name: Comprobar el nombre bajo el ícono
        run: |
          grep -q '<string name="title_activity_main">Florentino SIG</string>' android/app/src/main/res/values/strings.xml
          grep -q '<string name="app_name">Don Florentino SIG</string>' android/app/src/main/res/values/strings.xml

      # APK de PRUEBA: se firma con una clave fija (de depuración), así cada APK nuevo se instala SOBRE el anterior
      # y no pierdes tus proyectos al actualizar. Esa clave es pública: este APK sirve para probar, no para publicar.
      # Por eso el archivo y el artefacto llevan «prueba» en el nombre (2.33.0): no se confunden con el paquete de Google Play.
      - name: Usar la clave de firma fija
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nombrar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk don-florentino-sig-prueba.apk

      # Si el APK no lleva la llave fija, Android no lo deja instalar encima del anterior («conflicto con un paquete»): se detiene aquí
      - name: Comprobar que el APK lleva la llave fija
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ESPERADA=$(keytool -list -v -keystore scripts/debug.keystore -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          TIENE=$("$AS" verify --print-certs don-florentino-sig-prueba.apk | grep 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "llave esperada: $ESPERADA"; echo "llave del APK:  $TIENE"
          test -n "$ESPERADA" && test "$ESPERADA" = "$TIENE"

      - uses: actions/upload-artifact@v4
        with:
          name: don-florentino-sig-prueba-apk
          path: don-florentino-sig-prueba.apk
          if-no-files-found: error

      # PAQUETE DE PUBLICACIÓN (.aab) para Google Play: solo se arma si en Settings → Secrets and variables → Actions
      # están los cuatro secretos de la llave de carga (ver README, «Publicar en Google Play»). Sin ellos se omite y el APK de prueba sale igual.
      - name: ¿Hay llave de publicación?
        id: llave
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No hay llave de publicación (secretos ANDROID_*): se omite el .aab. El APK de prueba sí se compiló."
          fi

      - name: Compilar el paquete de publicación (.aab)
        if: steps.llave.outputs.hay == 'true'
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../don-florentino-sig-google-play.aab

      # Guardia (2.33.0): el paquete de Google Play NUNCA puede ir firmado con la llave de prueba (es pública: está en el repositorio).
      # Si el .aab no está firmado o lleva esa llave, el flujo se detiene aquí y el .aab no se guarda.
      - name: Comprobar que el .aab NO lleva la llave de prueba
        if: steps.llave.outputs.hay == 'true'
        run: node scripts/check-aab-key.js don-florentino-sig-google-play.aab scripts/debug.keystore

      - name: Guardar el paquete de publicación
        if: steps.llave.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: don-florentino-sig-google-play-aab
          path: don-florentino-sig-google-play.aab
          if-no-files-found: error
