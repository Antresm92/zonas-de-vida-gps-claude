name: Compilar APK de Android

# Se ejecuta a mano (pestaña Actions > "Compilar APK de Android" > Run workflow)
# y también cada vez que subes cambios a la rama principal.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pruebas del cálculo (área y zonas de vida)
        run: npm test

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Permisos de GPS e ícono
        run: node scripts/patch-android.js

      - name: Comprobar que el manifiesto pide el GPS
        run: grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Copiar la web a Android
        run: npx cap sync android

      # Clave de firma fija: así cada APK nuevo se instala SOBRE el anterior
      # y no pierdes tus proyectos al actualizar.
      - name: Usar la clave de firma fija
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nombrar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zonas-de-vida.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zonas-de-vida-apk
          path: zonas-de-vida.apk
          if-no-files-found: error
