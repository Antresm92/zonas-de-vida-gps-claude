<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14301F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Zonas de Vida</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <button class="proj" data-act="projects" aria-label="Cambiar de proyecto">
      <span class="proj-name" id="projName">Proyecto</span>
      <svg viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <div class="chips">
      <span class="chip chip-off" id="netChip" hidden>Sin conexión</span>
      <span class="chip chip-off" id="gpsChip"><i></i><span id="gpsChipText">GPS apagado</span></span>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="tab" id="tab-puntos" aria-labelledby="nav-puntos"></section>
    <section class="tab" id="tab-area" aria-labelledby="nav-area" hidden></section>
    <section class="tab" id="tab-clima" aria-labelledby="nav-clima" hidden></section>
    <section class="tab" id="tab-informe" aria-labelledby="nav-informe" hidden></section>
    <section class="tab" id="tab-herramientas" aria-labelledby="nav-herramientas" hidden></section>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <button id="nav-puntos" data-act="tab" data-tab="puntos" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.2A7 7 0 0 1 19 9.8C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.8" r="2.4" fill="currentColor"/></svg>
      <span>Puntos</span>
    </button>
    <button id="nav-area" data-act="tab" data-tab="area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17l3-11 11 3-2 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="5" cy="17" r="1.6" fill="currentColor"/><circle cx="8" cy="6" r="1.6" fill="currentColor"/><circle cx="19" cy="9" r="1.6" fill="currentColor"/><circle cx="17" cy="19" r="1.6" fill="currentColor"/></svg>
      <span>Polígono</span>
    </button>
    <button id="nav-clima" data-act="tab" data-tab="clima">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="17.5" r="1.8" fill="currentColor"/></svg>
      <span>Información</span>
    </button>
    <button id="nav-informe" data-act="tab" data-tab="informe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 12.5l2.4 2.4 4.6-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Reporte</span>
    </button>
    <button id="nav-herramientas" data-act="tab" data-tab="herramientas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Herramientas</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="busy" class="busy" role="alertdialog" aria-modal="true" aria-labelledby="busyTitle" aria-describedby="busyDetail" hidden>
    <div class="busy-card" id="busyCard" tabindex="-1">
      <div class="busy-spin" aria-hidden="true"></div>
      <h2 id="busyTitle"></h2>
      <p id="busyDetail" class="busy-detail" role="status" aria-live="polite"></p>
      <p id="busyNote" class="small muted"></p>
      <button class="btn" id="busyHide" data-act="busyHide" hidden>Ocultar este aviso</button>
    </div>
  </div>
  <input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain" hidden>
  <input type="file" id="gisFile" accept=".kml,.kmz,.geojson,.json,.gpx,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz,application/geo+json,application/json,application/gpx+xml,application/xml,text/xml,application/octet-stream" hidden>
  <input type="file" id="backupFile" accept=".json,.zip,application/json,application/zip,application/x-zip-compressed,text/plain,application/octet-stream" hidden>
  <input type="file" id="photoCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="photoGal" accept="image/*" multiple hidden>
  <input type="file" id="logoFile" accept="image/*" hidden>

  <script src="js/geo.js"></script>
  <script src="js/predio.js"></script>
  <script src="js/clasif.js"></script>
  <script src="js/holdridge.js"></script>
  <script src="js/climate.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/fmt.js"></script>
  <script src="js/units.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/fotos.js"></script>
  <script src="js/store.js"></script>
  <script src="js/xml.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/gis.js"></script>
  <script src="js/shp.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/walter-lieth.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/mapview.js"></script>
  <script src="js/satelite.js"></script>
  <script src="js/io.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/perfil.js"></script>
  <script src="js/report.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/reportpdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
